# EGO planner parameters (ego_planner_node backend, selected via
# planner_backend:=ego). Loaded into the ego_planner_node private namespace
# by bringup/launch/includes/ego_planner.launch.xml; read by EGOReplanFSM /
# EGOPlannerManager / PolyTrajOptimizer as "<section>/<name>"
# (same convention as SUPER's bringup/config/super_planner.yaml).
fsm:
  # Target source: 1 manual, 2 explore (subscribe local_goal), 3 preset.
  flight_type: 2
  # Consumption radius for intermediate window waypoints [m].
  wp_reach_radius: 0.5
  # Arrival radius for the final waypoint / single goal [m].
  goal_reach_radius: 0.5
  # Pass-by lateral tolerance for window waypoint consumption [m].
  wp_passby_lateral: 2.0

manager:
  drone_id: 0
  # User velocity / acceleration limits [m/s], [m/s^2].
  max_vel: 2.0
  max_acc: 4.0
  use_multitopology_trajs: false

# Planned camera frustum in body +X. These values must be positive; the
# PerceptionUtils defaults are -1 sentinels and would reverse the RViz FOV.
camera_fov:
  top_angle: 0.6
  left_angle: 0.76
  right_angle: 0.76
  max_dist: 6.0
  vis_dist: 1.0

optimization:
  weight_obstacle: 10000.0
  weight_obstacle_soft: 5000.0
  weight_trust_region: 100000.0
  weight_curve_fitting: 0.0
  weight_plane: 100.0
  weight_swarm: 100000.0
  weight_feasibility: 10000.0
  weight_sqrvariance: 10000.0
  weight_time: 10.0
  # Hard clearance from obstacles [m]; matches grid_map/obstacles_inflation.
  obstacle_clearance: 0.1
  obstacle_clearance_soft: 0.5
  swarm_clearance: 0.5
  # Param names are the upstream "max_jer"/"max_sna" spellings.
  max_jer: 4.0
  max_sna: 10.0

# 3D sliding grid map (plan_env). Single source for BOTH the planner node
# (rosparam load in ego_planner.launch.xml) and the mission-side local grid
# map owned by the ego planner process.
grid_map:
  local_update_range_x: 8.0
  local_update_range_y: 8.0
  local_update_range_z: 4.0
  # the ego is only one-layer inflatoin to consider robot_r
  # we now consider robot_r is 0.3 + 0.1 inflation
  obstacles_inflation: 0.3
  enable_virtual_wall: false
  virtual_ceil: 3.0
  virtual_ground: -0.5
  visual_inflat_map_height: 2.0
  cx: 320.0
  cy: 240.0
  fx: 442.025
  fy: 442.025
  k_depth_scaling_factor: 1.0
  skip_pixel: 2
  depth_filter_maxdist: 4.5
  depth_filter_mindist: 0.1
  depth_filter_margin: 2
  # Motion-artifact suppression for registered LiDAR clouds.
  cloud_odom_sync_tolerance: 0.15
  cloud_outlier_radius: 0.18
  cloud_outlier_min_neighbors: 2
  # Adjustable vehicle self-point envelope; keep small to preserve nearby obstacles.
  cloud_self_filter_radius: 0.10
  cloud_self_filter_z_min: -0.30
  cloud_self_filter_z_max: 0.40
  p_hit: 0.90
  p_miss: 0.49
  p_min: 0.12
  p_max: 0.98
  p_occ: 0.85
  fading_time: 3.0
  min_ray_length: 0.1
  max_ray_length: 4.0
  show_occ_time: false
  input_mode: cloud
  pose_type: 2
  frame_id: world
  hit_accum_max: 40
  hit_accum_threshold: 10
